name: prostuti
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.3+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cached_network_image: ^3.4.1
  connectivity_plus: ^4.0.2
  cupertino_icons: ^1.0.8
  dartz:
  dio: ^5.7.0
  file_picker:
  fl_chart: ^0.65.0
  flip_card: ^0.7.0
  flutter_animate: ^4.5.0
  flutter_launcher_icons: ^0.14.1
  flutter_riverpod: ^2.5.3
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.2
  fluttertoast: ^8.2.12
  gap: ^3.0.1
  google_fonts: ^6.2.1
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  intl:
  ionicons: ^0.2.2
  logger: ^2.5.0                   # Better logging
  modal_bottom_sheet: ^3.0.0
  open_filex: ^4.7.0
  path_provider:
  pinput: ^5.0.0
  pod_player: ^0.2.2
  pretty_dio_logger: ^1.4.0        # Nice logging for Dio requests
  pull_to_refresh_flutter3: ^2.0.2
  riverpod_annotation: ^2.5.3
  shared_preferences:
  skeletonizer: 1.4.2
  smooth_page_indicator: ^1.2.0+3
  socket_io_client: ^3.1.1
  swipable_stack: ^2.0.0
  table_calendar: ^3.1.2
  timeago: ^3.7.0
  twilio_flutter: ^0.9.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.8.0

dev_dependencies:
  build_runner: ^2.1.11
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  monarch: ^3.0.0
  riverpod_generator:
  riverpod_lint:



flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - lib/l10n/app_bn.arb
    - lib/l10n/app_en.arb

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_localizations:
      enabled: true